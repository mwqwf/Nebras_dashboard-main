# Firebase App Hosting configuration for the Nebras dashboard (SvelteKit).
# Docs: https://firebase.google.com/docs/app-hosting/configure

# Explicitly override build/run commands so App Hosting does not try to
# auto-detect a framework adapter (only Next.js & Angular are preconfigured).
scripts:
  buildCommand: npm run build
  runCommand: node build

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: OWNER_CODE_SECRET
    secret: OWNER_CODE_SECRET
    availability:
      - RUNTIME
  - variable: SMTP_PASS
    secret: SMTP_PASS
    availability:
      - RUNTIME
  - variable: NEBRAS_SERVICE_ACCOUNT_JSON
    secret: NEBRAS_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME
  - variable: MSHCAT_SERVICE_ACCOUNT_JSON
    secret: MSHCAT_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME
  - variable: OLDAPP_SERVICE_ACCOUNT_JSON
    secret: OLDAPP_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME
