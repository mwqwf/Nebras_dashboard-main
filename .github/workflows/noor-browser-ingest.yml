name: Noor Browser Ingest (real books → Nebras)

# جلب آليّ حقيقيّ لكتب مكتبة نور العامّة إلى نبراس، بلا أيّ تدخّل يدويّ.
#
# لماذا هنا وليس Vercel؟ استخراج رابط تنزيل نور يحتاج متصفّحاً حقيقياً (JS +
# مصافحة تحقّق) لا يعمل على serverless. GitHub Actions يشغّل Chromium مجّاناً.
# المُشغِّل يستخرج رابط internal_download العامّ ثمّ يرسله إلى الخادم (Vercel)،
# الذي يجلب البايتات بـ fetch عاديّ ويرفعها ويصنّفها بلا ذكاء اصطناعي.
#
# لا يحتاج أيّ سرّ جديد. أسرار اختياريّة في GitHub:
#   • VERCEL_URL   — قاعدة عنوان اللوحة (افتراضي nebras-dashboard-main.vercel.app)
#   • CRON_SECRET  — إن ضُبط في GitHub + Vercel معاً، يُشدَّد منفذ /ingest.

on:
  # ⚠ هذا workflow ثقيل (npm + Chromium + متصفّح): كلّ تشغيلة تستهلك دقائق
  #   Actions كثيرة مقارنةً بنبضات الـ curl. لتفادي استنزاف ميزانية الدقائق
  #   المشتركة (التي تفشّل جميع الـ workflows عند نفادها) نُشغّله **مرّة يومياً
  #   فقط** بأكبر عدد كتب يسع في ميزانية زمنيّة محدودة (كفاءة قصوى للدقائق:
  #   تكلفة الإعداد الثابتة تُوزَّع على أكبر عدد كتب). للتشغيل الفوريّ: Run workflow.
  schedule:
    - cron: '15 3 * * *' # مرّة يومياً (03:15 UTC)
  workflow_dispatch:
    inputs:
      max_books:
        description: 'أقصى عدد كتب لهذا التشغيل'
        required: false
        default: '25'

concurrency:
  group: noor-browser-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run:
        working-directory: Nebras_dashboard-main/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # ملاحظة: pdfjs-dist يتطلّب node>=22.13 و.npmrc فيه engine-strict=true،
          # فيفشل npm ci على node 20 بـ EBADENGINE. node 22 يحلّ ذلك.
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run Noor browser ingest
        env:
          VERCEL_BASE: ${{ secrets.VERCEL_URL || 'https://nebras-dashboard-main.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NOOR_MAX_BOOKS: ${{ github.event.inputs.max_books || '25' }}
          NOOR_MAX_MS: '1200000'
        run: node scripts/noor-ci-ingest.mjs
