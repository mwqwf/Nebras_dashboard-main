name: Internet Archive Auto-Tick

# ╔═══════════════════════════════════════════════════════════════════╗
# ║  لماذا هذا الـ workflow؟                                            ║
# ║  Vercel Hobby = cron يومي فقط. لذا نستعمل GitHub Action مجاناً     ║
# ║  ليضرب /api/cron/internet-archive-tick كل 10 دقائق.                ║
# ║                                                                   ║
# ║  لماذا 10 دقائق؟                                                   ║
# ║    • GitHub يوصي بـ ≥5 دقائق وقد يتأخّر 10-30 دقيقة تحت الضغط       ║
# ║      (https://cronbuilder.dev/blog/github-actions-cron-schedule)   ║
# ║    • Internet Archive Scrape API محدودة بـ ~60 req/min             ║
# ║      (https://archive.org/developers/index-apis.html)              ║
# ║    • Vercel function timeout = 60s (Hobby/Pro) — كل tick يستغرق    ║
# ║      ~30-45s، لذا 10 دقائق تمنع تداخل ticks.                       ║
# ║                                                                   ║
# ║  Stagger: نستعمل '*/10 7-23 * * *' لتجنّب الساعات الميتة وحَدِّ     ║
# ║  مكتبة فيها ضغط على GitHub.                                        ║
# ║                                                                   ║
# ║  Secrets في GitHub repo settings:                                  ║
# ║    • VERCEL_URL  (اختياري) — URL النشر (افتراضي: nebras-dashboard) ║
# ║    • CRON_SECRET (مُستحسَن) — اضبطه في GitHub + Vercel env معاً     ║
# ║      للتقوية (fail-closed). بدونه المنفذ يسمح بالنبضة افتراضياً.     ║
# ╚═══════════════════════════════════════════════════════════════════╝

on:
  schedule:
    # كل 5 دقائق ضمن ساعات نشاط معقولة (07:00-23:59 UTC). مع batchSize=8
    # وتزامن داخليّ (IMPORT_CONCURRENCY=4) يرفع الإنتاجيّة لعدّة مئات يومياً
    # دون استنفاد ratelimit الأرشيف (concurrency:group يمنع تداخل الدورات).
    - cron: '*/5 7-23 * * *'
  workflow_dispatch: # تشغيل يدوي من GitHub UI عند الحاجة

# منع تشغيل أكثر من نسخة في نفس الوقت (يمنع تداخل ticks).
concurrency:
  group: ia-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hit-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve target URL
        id: target
        run: |
          BASE="${{ secrets.VERCEL_URL }}"
          if [ -z "$BASE" ]; then
            BASE="https://nebras-dashboard-main.vercel.app"
          fi
          # إزالة trailing slash لو وُجد
          BASE="${BASE%/}"
          echo "url=${BASE}/api/cron/internet-archive-tick" >> "$GITHUB_OUTPUT"

      - name: Hit IA engine tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="${{ steps.target.outputs.url }}"
          echo "▶ Pinging: $URL"

          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          else
            echo "ℹ CRON_SECRET غير مضبوط في GitHub secrets — المنفذ سيسمح بالنبضة (secure-by-configuration). اضبطه + Vercel env معاً للتقوية (fail-closed)."
            AUTH_HEADER="X-No-Auth: 1"
          fi

          # -sS: silent but show errors
          # --max-time 90: المهلة الكاملة (60s Vercel + هامش)
          # --retry 2: محاولتان إضافيتان لو فشل الاتصال
          # --retry-delay 5: 5 ثوانٍ بين المحاولات
          # -w: نطبع كود الاستجابة في النهاية
          HTTP_CODE=$(curl -sS \
            --max-time 90 \
            --retry 2 --retry-delay 5 \
            --retry-connrefused \
            -H "$AUTH_HEADER" \
            -H "User-Agent: NebrasGitHubAction/1.0" \
            -o /tmp/ia-response.json \
            -w "%{http_code}" \
            "$URL") || HTTP_CODE="000"

          echo "HTTP $HTTP_CODE"
          if [ -s /tmp/ia-response.json ]; then
            echo "--- Response (first 2KB) ---"
            head -c 2048 /tmp/ia-response.json
            echo ""
          fi

          # نقبل 2xx — أي شيء آخر = فشل (لكن لا نفشل الـ workflow لأنّ Vercel
          # cold-start قد يُرجع 504 أحياناً، والـ retry التالي سينجح).
          case "$HTTP_CODE" in
            2*) echo "✅ Success" ;;
            *)  echo "⚠ Non-2xx response ($HTTP_CODE) — sera retried by next schedule." ;;
          esac
