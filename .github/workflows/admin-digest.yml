name: Admin Chat Daily Digest

# الموجز اليومي لدردشة الإدارة 📊 — Vercel Hobby مستنفَد بكرونَيه،
# فنستعمل GitHub Action (نفس نمط ia-cron.yml).

on:
  schedule:
    - cron: '10 4 * * *' # يوميّاً 04:10 UTC (صباحاً بتوقيت المنطقة العربيّة).
  workflow_dispatch:

concurrency:
  group: admin-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hit-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit daily digest endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
        run: |
          BASE="${VERCEL_URL:-https://nebras-dashboard-main.vercel.app}"
          BASE="${BASE%/}"
          URL="${BASE}/api/cron/admin-daily-digest"
          echo "▶ Pinging: $URL"
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          else
            AUTH_HEADER="X-No-Auth: 1"
          fi
          HTTP_CODE=$(curl -sS --max-time 90 --retry 2 --retry-delay 5 \
            --retry-connrefused \
            -H "$AUTH_HEADER" \
            -H "User-Agent: NebrasGitHubAction/1.0" \
            -o /tmp/resp.json -w "%{http_code}" "$URL") || HTTP_CODE="000"
          echo "HTTP $HTTP_CODE"
          [ -s /tmp/resp.json ] && head -c 2048 /tmp/resp.json && echo ""
          case "$HTTP_CODE" in
            2*) echo "✅ Success" ;;
            *)  echo "⚠ Non-2xx ($HTTP_CODE) — التالي سيعوّض." ;;
          esac
